<line class="g" x1="40" y1="436.8" x2="254.4" y2="436.8"/></g>

<rect class="frame" x="40" y="52" width="300" height="168.8"/>
<rect class="frame" x="40" y="336.8" width="214.4" height="120.6"/>

<text class="dim" x="40" y="236.8">1920 x 1080</text>
<text class="dim" x="40" y="473.4">1372 x 772</text>

<path class="beam" d="M 190 220.8 C 190 266.8, 147.2 276.8, 147.2 336.8"/>
<path class="beam" d="M 54 457.4 C 54 497.4, 54 294.8, 54 250.8"/>
<circle class="trav t1" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.06;0.34;1" calcMode="linear" path="M 190 220.8 C 190 266.8, 147.2 276.8, 147.2 336.8"/></circle>
<circle class="trav t2" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.78;1" calcMode="linear" path="M 54 457.4 C 54 497.4, 54 294.8, 54 250.8"/></circle>

<g class="lab">
<text class="cap" x="190" y="260.8">screenshot</text>
<text class="num" x="190" y="275.8">x 0.715</text>
<text class="cap" x="190" y="294.8">click</text>
<text class="num" x="190" y="309.8">x 1.399</text>
</g>

