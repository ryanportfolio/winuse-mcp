<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="The same point in two coordinate spaces. A 1920 by 1080 screen is captured as a 1372 by 772 screenshot. Claude clicks at 686, 443 in that screenshot and the server multiplies by 1920/1372 to fire the click at 960, 620 on the real screen. The screen origin is marked separately, because a click is never allowed to land there.">
<style>
.frame{fill:none;stroke:#aeb8c2;stroke-width:1.25}
.g{stroke:#dbe1e8;stroke-width:1}
.beam{fill:none;stroke:#6e7781;stroke-width:1.2;stroke-dasharray:3 4}
.tip{fill:#6e7781}
.fire{fill:#bc4c00}
.trav{fill:#6e7781}
.ax{stroke:#bc4c00;stroke-width:1.4}
.dot{fill:#bc4c00}
.orig{fill:#59636e}
.ttl{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.sub{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
.cap{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.num,.dim{font:400 11.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}
.tiny{font:400 10px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}
.coord{font:600 12.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
.ring{fill:none;stroke:#bc4c00;stroke-width:1.6;opacity:0}
.t1,.t2{opacity:0}
.t1{animation:t1 6s linear infinite}
.t2{animation:t2 6s linear infinite}
.ring{animation:ring 6s linear infinite}
@keyframes t1{0%,5%{opacity:0}6%,33%{opacity:1}35%,100%{opacity:0}}
@keyframes t2{0%,49%{opacity:0}50%,77%{opacity:1}79%,100%{opacity:0}}
@keyframes ring{0%,77%{opacity:0;r:6}80%{opacity:.9;r:7}92%,100%{opacity:0;r:19}}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .trav,.ring{opacity:0}
}</style>

<g class="lab">
<text class="ttl" x="40" y="50">native screen</text>
<text class="sub" x="40" y="66">what Windows draws</text>
<text class="ttl" x="604.2" y="76.5">model screen</text>
<text class="sub" x="604.2" y="92.5">what Claude is sent</text>
</g>

<g class="gridline"><line class="g" x1="67.5" y1="76" x2="67.5" y2="261.6"/>
<line class="g" x1="95" y1="76" x2="95" y2="261.6"/>
