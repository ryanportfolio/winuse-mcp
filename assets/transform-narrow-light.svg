<line class="g" x1="315" y1="52" x2="315" y2="220.8"/>
<line class="g" x1="40" y1="77" x2="340" y2="77"/>
<line class="g" x1="40" y1="102" x2="340" y2="102"/>
<line class="g" x1="40" y1="127" x2="340" y2="127"/>
<line class="g" x1="40" y1="152" x2="340" y2="152"/>
<line class="g" x1="40" y1="177" x2="340" y2="177"/>
<line class="g" x1="40" y1="202" x2="340" y2="202"/></g>
<g class="gridline"><line class="g" x1="65" y1="336.8" x2="65" y2="457.4"/>
<line class="g" x1="90" y1="336.8" x2="90" y2="457.4"/>
<line class="g" x1="115" y1="336.8" x2="115" y2="457.4"/>
<line class="g" x1="140" y1="336.8" x2="140" y2="457.4"/>
<line class="g" x1="165" y1="336.8" x2="165" y2="457.4"/>
<line class="g" x1="190" y1="336.8" x2="190" y2="457.4"/>
<line class="g" x1="215" y1="336.8" x2="215" y2="457.4"/>
<line class="g" x1="240" y1="336.8" x2="240" y2="457.4"/>
<line class="g" x1="40" y1="361.8" x2="254.4" y2="361.8"/>
<line class="g" x1="40" y1="386.8" x2="254.4" y2="386.8"/>
