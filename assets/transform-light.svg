<text class="dim" x="26" y="275.6">1920 x 1080</text>
<text class="dim" x="566" y="249.2">1372 x 772</text>

<path class="beam" d="M 356 98 C 434 98, 488 116.5, 566 116.5"/>
<path class="beam" d="M 566 217.2 C 488 217.2, 434 235.6, 356 235.6"/>
<circle class="trav t1" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.06;0.34;1" calcMode="linear" path="M 356 98 C 434 98, 488 116.5, 566 116.5"/></circle>
<circle class="trav t2" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.78;1" calcMode="linear" path="M 566 217.2 C 488 217.2, 434 235.6, 356 235.6"/></circle>

<g class="lab">
<text class="cap" x="436" y="86">screenshot</text>
