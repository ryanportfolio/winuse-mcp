<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" role="img" aria-label="The 18 tools this server exposes, grouped by what they do. 4 read: screenshot, zoom, record, cursor_position. 13 act: left_click, double_click, triple_click, right_click, middle_click, mouse_move, left_click_drag, left_mouse_down, left_mouse_up, type, key, hold_key, scroll. 1 wait: wait.">
<style>
.gl{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}
.gn{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#9198a1}
.gc{font:400 12px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9198a1}
.tot{font:600 12.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f0f6fc}
.rule{stroke:#3d444d;stroke-width:1}
.chip{fill:none;stroke:#4a525c;stroke-width:1}
.cn{font:400 12.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f0f6fc}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .trav,.ring{opacity:0}
}</style>
<text class="gl" x="18" y="24">reads</text>
<text class="gn" x="70" y="24">what comes back</text>
<text class="gc" x="219" y="24">4 tools</text>
<line class="rule" x1="18" y1="32" x2="862" y2="32"/>
<rect class="chip" x="18" y="48" width="100" height="22" rx="3"/>
<text class="cn" x="68" y="63.4" text-anchor="middle">screenshot</text>
<rect class="chip" x="126" y="48" width="53" height="22" rx="3"/>
<text class="cn" x="152.5" y="63.4" text-anchor="middle">zoom</text>
<rect class="chip" x="187" y="48" width="69" height="22" rx="3"/>
<text class="cn" x="221.5" y="63.4" text-anchor="middle">record</text>
<rect class="chip" x="264" y="48" width="139" height="22" rx="3"/>
<text class="cn" x="333.5" y="63.4" text-anchor="middle">cursor_position</text>
<text class="gl" x="18" y="94">acts</text>
<text class="gn" x="70" y="94">what gets sent</text>
<text class="gc" x="219" y="94">13 tools</text>
<line class="rule" x1="18" y1="102" x2="862" y2="102"/>
<rect class="chip" x="18" y="118" width="100" height="22" rx="3"/>
<text class="cn" x="68" y="133.4" text-anchor="middle">left_click</text>
<rect class="chip" x="126" y="118" width="116" height="22" rx="3"/>
