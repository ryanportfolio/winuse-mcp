<text class="gn" x="70" y="192">pauses between actions</text>
<text class="gc" x="219" y="192">1 tool</text>
<line class="rule" x1="18" y1="200" x2="862" y2="200"/>
<rect class="chip" x="18" y="216" width="53" height="22" rx="3"/>
<text class="cn" x="44.5" y="231.4" text-anchor="middle">wait</text>
<line class="rule" x1="18" y1="258" x2="862" y2="258"/>
<text class="tot" x="18" y="276">4 + 13 + 1 = 18 tools</text>
</svg>