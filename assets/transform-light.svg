<line class="g" x1="177.5" y1="76" x2="177.5" y2="261.6"/>
<line class="g" x1="205" y1="76" x2="205" y2="261.6"/>
<line class="g" x1="232.5" y1="76" x2="232.5" y2="261.6"/>
<line class="g" x1="260" y1="76" x2="260" y2="261.6"/>
<line class="g" x1="287.5" y1="76" x2="287.5" y2="261.6"/>
<line class="g" x1="315" y1="76" x2="315" y2="261.6"/>
<line class="g" x1="342.5" y1="76" x2="342.5" y2="261.6"/>
<line class="g" x1="40" y1="103.5" x2="370" y2="103.5"/>
<line class="g" x1="40" y1="131" x2="370" y2="131"/>
<line class="g" x1="40" y1="158.5" x2="370" y2="158.5"/>
<line class="g" x1="40" y1="186" x2="370" y2="186"/>
<line class="g" x1="40" y1="213.5" x2="370" y2="213.5"/>
<line class="g" x1="40" y1="241" x2="370" y2="241"/></g>
<g class="gridline"><line class="g" x1="631.7" y1="102.5" x2="631.7" y2="235.2"/>
<line class="g" x1="659.2" y1="102.5" x2="659.2" y2="235.2"/>
<line class="g" x1="686.7" y1="102.5" x2="686.7" y2="235.2"/>
<line class="g" x1="714.2" y1="102.5" x2="714.2" y2="235.2"/>
<line class="g" x1="741.7" y1="102.5" x2="741.7" y2="235.2"/>
<line class="g" x1="769.2" y1="102.5" x2="769.2" y2="235.2"/>
<line class="g" x1="796.7" y1="102.5" x2="796.7" y2="235.2"/>
<line class="g" x1="824.2" y1="102.5" x2="824.2" y2="235.2"/>
<line class="g" x1="604.2" y1="130" x2="840" y2="130"/>
<line class="g" x1="604.2" y1="157.5" x2="840" y2="157.5"/>
<line class="g" x1="604.2" y1="185" x2="840" y2="185"/>
<line class="g" x1="604.2" y1="212.5" x2="840" y2="212.5"/></g>

<rect class="frame" x="40" y="76" width="330" height="185.6"/>
<rect class="frame" x="604.2" y="102.5" width="235.8" height="132.7"/>

<circle class="orig" cx="40" cy="76" r="2.6"/>
<text class="tiny" x="48" y="91">0, 0 refuses clicks</text>

<text class="dim" x="40" y="278.6">1920 x 1080</text>
<text class="dim" x="604.2" y="252.2">1372 x 772</text>

<path class="beam" d="M 370 102 C 475.4 102, 498.8 120.5, 604.2 120.5"/>
<path class="beam ret" d="M 604.2 217.2 C 498.8 217.2, 475.4 235.6, 370 235.6"/>
<path class="tip" d="M 0 0 L -9 -3.6 L -9 3.6 Z" transform="translate(604.2 120.5) rotate(0)"/>
<path class="tip fire" d="M 0 0 L -9 -3.6 L -9 3.6 Z" transform="translate(370 235.6) rotate(180)"/>
<circle class="trav t1" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.06;0.34;1" calcMode="linear" path="M 370 102 C 475.4 102, 498.8 120.5, 604.2 120.5"/></circle>
<circle class="trav t2 fire" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.78;1" calcMode="linear" path="M 604.2 217.2 C 498.8 217.2, 475.4 235.6, 370 235.6"/></circle>

<g class="lab">
<text class="cap" x="416" y="72">screenshot</text>
<text class="num" x="416" y="87">x 1372/1920</text>
<text class="cap" x="416" y="265.6">click</text>
<text class="num" x="416" y="280.6">x 1920/1372</text>
</g>

<g class="hit">
<line class="ax" x1="708.1" y1="178.6" x2="736.1" y2="178.6"/>
<line class="ax" x1="722.1" y1="164.6" x2="722.1" y2="192.6"/>
<circle class="dot" cx="722.1" cy="178.6" r="3.2"/>
</g>
<g class="hit">
<line class="ax" x1="191" y1="182.5" x2="219" y2="182.5"/>
<line class="ax" x1="205" y1="168.5" x2="205" y2="196.5"/>
<circle class="dot" cx="205" cy="182.5" r="3.2"/>
</g>
<circle class="ring" cx="205" cy="182.5" r="6"/>

<text class="coord" x="740.1" y="169.6">686, 443</text>
<text class="coord" x="223" y="173.5">960, 620</text>

</svg>