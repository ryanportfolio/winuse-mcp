<text class="cn" x="226.5" y="161.4" text-anchor="middle">left_mouse_up</text>
<rect class="chip" x="296" y="146" width="53" height="22" rx="3"/>
<text class="cn" x="322.5" y="161.4" text-anchor="middle">type</text>
<rect class="chip" x="357" y="146" width="45" height="22" rx="3"/>
<text class="cn" x="379.5" y="161.4" text-anchor="middle">key</text>
<rect class="chip" x="410" y="146" width="84" height="22" rx="3"/>
<text class="cn" x="452" y="161.4" text-anchor="middle">hold_key</text>
