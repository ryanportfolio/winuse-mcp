<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 556" width="380" height="556" role="img" aria-label="The same point in two coordinate spaces. A 1920 by 1080 screen is captured as a 1372 by 772 screenshot. Claude clicks at 686, 443 in that screenshot and the server multiplies by 1920/1372 to fire the click at 960, 620 on the real screen. The screen origin is marked separately, because a click is never allowed to land there.">
<style>
.frame{fill:none;stroke:#4a525c;stroke-width:1.25}
.g{stroke:#272d35;stroke-width:1}
.beam{fill:none;stroke:#7d8590;stroke-width:1.2;stroke-dasharray:3 4}
.tip{fill:#7d8590}
.fire{fill:#f0883e}
.trav{fill:#7d8590}
.ax{stroke:#f0883e;stroke-width:1.4}
.dot{fill:#f0883e}
.orig{fill:#9198a1}
.ttl{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}
.sub{font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#9198a1}
.cap{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}
.num,.dim{font:400 12px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9198a1}
.tiny{font:400 10.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9198a1}
.coord{font:600 12.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f0f6fc}
.ring{fill:none;stroke:#f0883e;stroke-width:1.6;opacity:0}
.t1,.t2{opacity:0}
.t1{animation:t1 6s linear infinite}
.t2{animation:t2 6s linear infinite}
.ring{animation:ring 6s linear infinite}
@keyframes t1{0%,5%{opacity:0}6%,33%{opacity:1}35%,100%{opacity:0}}
@keyframes t2{0%,49%{opacity:0}50%,77%{opacity:1}79%,100%{opacity:0}}
@keyframes ring{0%,77%{opacity:0;r:6}80%{opacity:.9;r:7}92%,100%{opacity:0;r:19}}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .trav,.ring{opacity:0}
}</style>

<g class="lab">
<text class="ttl" x="20" y="20">native screen</text>
<text class="sub" x="20" y="36">what Windows draws</text>
<text class="ttl" x="20" y="359.3">model screen</text>
<text class="sub" x="20" y="375.3">what Claude is sent</text>
</g>

<g class="gridline"><line class="g" x1="48.3" y1="46" x2="48.3" y2="237.3"/>
<line class="g" x1="76.7" y1="46" x2="76.7" y2="237.3"/>
<line class="g" x1="105" y1="46" x2="105" y2="237.3"/>
<line class="g" x1="133.3" y1="46" x2="133.3" y2="237.3"/>
<line class="g" x1="161.7" y1="46" x2="161.7" y2="237.3"/>
<line class="g" x1="190" y1="46" x2="190" y2="237.3"/>
<line class="g" x1="218.3" y1="46" x2="218.3" y2="237.3"/>
<line class="g" x1="246.7" y1="46" x2="246.7" y2="237.3"/>
<line class="g" x1="275" y1="46" x2="275" y2="237.3"/>
<line class="g" x1="303.3" y1="46" x2="303.3" y2="237.3"/>
<line class="g" x1="331.7" y1="46" x2="331.7" y2="237.3"/>
<line class="g" x1="20" y1="74.3" x2="360" y2="74.3"/>
<line class="g" x1="20" y1="102.7" x2="360" y2="102.7"/>
<line class="g" x1="20" y1="131" x2="360" y2="131"/>
<line class="g" x1="20" y1="159.4" x2="360" y2="159.4"/>
<line class="g" x1="20" y1="187.7" x2="360" y2="187.7"/>
<line class="g" x1="20" y1="216" x2="360" y2="216"/></g>
<g class="gridline"><line class="g" x1="48.3" y1="385.3" x2="48.3" y2="522"/>
<line class="g" x1="76.7" y1="385.3" x2="76.7" y2="522"/>
<line class="g" x1="105" y1="385.3" x2="105" y2="522"/>
<line class="g" x1="133.4" y1="385.3" x2="133.4" y2="522"/>
<line class="g" x1="161.7" y1="385.3" x2="161.7" y2="522"/>
<line class="g" x1="190" y1="385.3" x2="190" y2="522"/>
<line class="g" x1="218.4" y1="385.3" x2="218.4" y2="522"/>
<line class="g" x1="246.7" y1="385.3" x2="246.7" y2="522"/>
<line class="g" x1="20" y1="413.6" x2="263" y2="413.6"/>
<line class="g" x1="20" y1="442" x2="263" y2="442"/>
<line class="g" x1="20" y1="470.3" x2="263" y2="470.3"/>
<line class="g" x1="20" y1="498.6" x2="263" y2="498.6"/></g>

<rect class="frame" x="20" y="46" width="340" height="191.3"/>
<rect class="frame" x="20" y="385.3" width="243" height="136.7"/>

<circle class="orig" cx="20" cy="46" r="2.6"/>
<text class="tiny" x="28" y="61">0, 0 refuses clicks</text>

<text class="dim" x="20" y="254.3">1920 x 1080</text>
<text class="dim" x="20" y="539">1372 x 772</text>

<path class="beam" d="M 146.4 237.3 C 146.4 311.3, 146.4 311.3, 146.4 385.3"/>
<path class="beam ret" d="M 238.7 385.3 C 238.7 311.3, 238.7 311.3, 238.7 237.3"/>
<path class="tip" d="M 0 0 L -9 -3.6 L -9 3.6 Z" transform="translate(146.4 385.3) rotate(90)"/>
<path class="tip fire" d="M 0 0 L -9 -3.6 L -9 3.6 Z" transform="translate(238.7 237.3) rotate(-90)"/>
<circle class="trav t1" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.06;0.34;1" calcMode="linear" path="M 146.4 237.3 C 146.4 311.3, 146.4 311.3, 146.4 385.3"/></circle>
<circle class="trav t2 fire" r="3.4"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.78;1" calcMode="linear" path="M 238.7 385.3 C 238.7 311.3, 238.7 311.3, 238.7 237.3"/></circle>

<g class="lab">
<text class="cap" x="20" y="275.3">screenshot</text>
<text class="num" x="20" y="290.3">x 1372/1920</text>
<text class="cap" x="20" y="313.3">click</text>
<text class="num" x="20" y="328.3">x 1920/1372</text>
</g>

<g class="hit">
<line class="ax" x1="127.5" y1="463.7" x2="155.5" y2="463.7"/>
<line class="ax" x1="141.5" y1="449.7" x2="141.5" y2="477.7"/>
<circle class="dot" cx="141.5" cy="463.7" r="3.2"/>
</g>
<g class="hit">
<line class="ax" x1="176" y1="155.8" x2="204" y2="155.8"/>
<line class="ax" x1="190" y1="141.8" x2="190" y2="169.8"/>
<circle class="dot" cx="190" cy="155.8" r="3.2"/>
</g>
<circle class="ring" cx="190" cy="155.8" r="6"/>

<text class="coord" x="159.5" y="454.7">686, 443</text>
<text class="coord" x="208" y="146.8">960, 620</text>

</svg>