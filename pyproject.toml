[project]
name = "winuse-mcp"
version = "0.2.0"
description = "Computer use for Claude Code on Windows: screenshot and input control as an MCP server"
readme = "README.md"
authors = [
    { name = "ryanportfolio", email = "helpsardonicast@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
]

[project.scripts]
winuse-mcp = "winuse_mcp:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Only tests/. scripts/ holds *_test.py files that pytest would otherwise
# collect, and client_test.py drives the real mouse at import time.
testpaths = ["tests"]
