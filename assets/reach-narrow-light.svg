<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" role="img" aria-label="The 18 tools this server exposes, grouped by what they do. 4 read: screenshot, zoom, record, cursor_position. 13 act: left_click, double_click, triple_click, right_click, middle_click, mouse_move, left_click_drag, left_mouse_down, left_mouse_up, type, key, hold_key, scroll. 1 wait: wait.">
<style>
.gl{font:600 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.gn{font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}
.gc{font:400 11.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}
.tot{font:600 12px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
.rule{stroke:#d1d9e0;stroke-width:1}
.chip{fill:none;stroke:#aeb8c2;stroke-width:1}
.cn{font:400 11.5px ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .trav,.ring{opacity:0}
}</style>
<text class="gl" x="12" y="20">reads</text>
<text class="gn" x="58" y="20">what comes back</text>
<text class="gc" x="202" y="20">4 tools</text>
<line class="rule" x1="12" y1="28" x2="368" y2="28"/>
<rect class="chip" x="12" y="42" width="91" height="20" rx="3"/>
<text class="cn" x="57.5" y="56" text-anchor="middle">screenshot</text>
<rect class="chip" x="109" y="42" width="47" height="20" rx="3"/>
<text class="cn" x="132.5" y="56" text-anchor="middle">zoom</text>
<rect class="chip" x="162" y="42" width="62" height="20" rx="3"/>
<text class="cn" x="193" y="56" text-anchor="middle">record</text>
<rect class="chip" x="230" y="42" width="128" height="20" rx="3"/>
<text class="cn" x="294" y="56" text-anchor="middle">cursor_position</text>
<text class="gl" x="12" y="86">acts</text>
<text class="gn" x="58" y="86">what gets sent</text>
<text class="gc" x="202" y="86">13 tools</text>
<line class="rule" x1="12" y1="94" x2="368" y2="94"/>
<rect class="chip" x="12" y="108" width="91" height="20" rx="3"/>
<text class="cn" x="57.5" y="122" text-anchor="middle">left_click</text>
<rect class="chip" x="109" y="108" width="106" height="20" rx="3"/>
<text class="cn" x="162" y="122" text-anchor="middle">double_click</text>
<rect class="chip" x="221" y="108" width="106" height="20" rx="3"/>
<text class="cn" x="274" y="122" text-anchor="middle">triple_click</text>
<rect class="chip" x="12" y="133" width="98" height="20" rx="3"/>
<text class="cn" x="61" y="147" text-anchor="middle">right_click</text>
<rect class="chip" x="116" y="133" width="106" height="20" rx="3"/>
<text class="cn" x="169" y="147" text-anchor="middle">middle_click</text>
<rect class="chip" x="228" y="133" width="91" height="20" rx="3"/>
<text class="cn" x="273.5" y="147" text-anchor="middle">mouse_move</text>
<rect class="chip" x="12" y="158" width="128" height="20" rx="3"/>
<text class="cn" x="76" y="172" text-anchor="middle">left_click_drag</text>
<rect class="chip" x="146" y="158" width="128" height="20" rx="3"/>
<text class="cn" x="210" y="172" text-anchor="middle">left_mouse_down</text>
<rect class="chip" x="12" y="183" width="113" height="20" rx="3"/>
<text class="cn" x="68.5" y="197" text-anchor="middle">left_mouse_up</text>
<rect class="chip" x="131" y="183" width="47" height="20" rx="3"/>
<text class="cn" x="154.5" y="197" text-anchor="middle">type</text>
<rect class="chip" x="184" y="183" width="40" height="20" rx="3"/>
<text class="cn" x="204" y="197" text-anchor="middle">key</text>
<rect class="chip" x="230" y="183" width="76" height="20" rx="3"/>
<text class="cn" x="268" y="197" text-anchor="middle">hold_key</text>
<rect class="chip" x="12" y="208" width="62" height="20" rx="3"/>
<text class="cn" x="43" y="222" text-anchor="middle">scroll</text>
<text class="gl" x="12" y="252">waits</text>
<text class="gn" x="58" y="252">pauses between actions</text>
<text class="gc" x="202" y="252">1 tool</text>
<line class="rule" x1="12" y1="260" x2="368" y2="260"/>
<rect class="chip" x="12" y="274" width="47" height="20" rx="3"/>
<text class="cn" x="35.5" y="288" text-anchor="middle">wait</text>
<line class="rule" x1="12" y1="312" x2="368" y2="312"/>
<text class="tot" x="12" y="330">4 + 13 + 1 = 18 tools</text>
</svg>